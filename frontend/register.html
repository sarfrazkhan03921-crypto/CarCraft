<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarCraft - Register</title>
    <meta name="description" content="Create your free CarCraft account to shop parts, book services, and manage your vehicles.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

<!-- TOP NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top site-navbar w-100">
    <div class="container">
        <a class="navbar-brand fw-bold fs-3" href="index.html">
            <i class="bi bi-car-front-fill text-warning"></i>
            Car<span class="text-warning">Craft</span>
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a class="btn btn-outline-light btn-sm px-3" href="index.html">
                <i class="bi bi-house me-1"></i> Home
            </a>
            <a class="btn btn-warning btn-sm px-3" href="login.html">
                Login
            </a>
        </div>
    </div>
</nav>

<!-- CENTERED AUTH FORM -->
<div class="auth-container-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-9 col-lg-6 col-xl-5 d-flex justify-content-center">
                <div class="auth-card register-card shadow-sm">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus-fill text-warning" style="font-size: 2.4rem;"></i>
                        <h2 class="fw-bold mt-2 mb-1">
                            Create Car<span class="text-warning">Craft</span> Account
                        </h2>
                        <p class="text-muted small">Register as a customer for personalized garage and order tracking</p>
                    </div>

                    <!-- Error & Success Alerts -->
                    <div id="registerError" class="alert alert-danger d-none py-2 small" role="alert"></div>
                    <div id="registerSuccess" class="alert alert-success d-none py-2 small" role="alert"></div>

                    <form id="registerForm" novalidate>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-dark" for="regFullName">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input
                                    type="text"
                                    id="regFullName"
                                    class="form-control"
                                    placeholder="Enter full name"
                                    autocomplete="name"
                                    required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small text-dark" for="regEmail">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input
                                    type="email"
                                    id="regEmail"
                                    class="form-control"
                                    placeholder="name@example.com"
                                    autocomplete="email"
                                    required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small text-dark" for="regPhone">Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input
                                    type="tel"
                                    id="regPhone"
                                    class="form-control"
                                    placeholder="10-digit mobile number"
                                    autocomplete="tel"
                                    required>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-sm-6">
                                <label class="form-label fw-bold small text-dark" for="regPassword">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input
                                        type="password"
                                        id="regPassword"
                                        class="form-control"
                                        placeholder="Min 6 chars"
                                        autocomplete="new-password"
                                        required>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label fw-bold small text-dark" for="regPassword2">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                    <input
                                        type="password"
                                        id="regPassword2"
                                        class="form-control"
                                        placeholder="Re-enter password"
                                        autocomplete="new-password"
                                        required>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 py-2 fw-bold shadow-sm">
                            <i class="bi bi-person-check-fill me-1"></i> Create Account
                        </button>
                    </form>

                    <hr class="my-3">

                    <p class="text-center small mb-2 text-muted">
                        Already have an account?
                        <a href="login.html" class="fw-bold text-warning text-decoration-none">Login here</a>
                    </p>

                    <a href="index.html" class="btn btn-outline-dark btn-sm w-100 mt-2">
                        <i class="bi bi-arrow-left me-1"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-light py-3 mt-auto">
    <div class="container text-center text-secondary small">
        &copy; 2026 CarCraft | Automotive Dealership & Inventory Suite
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>

</body>

</html>
