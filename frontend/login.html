<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarCraft - Login</title>
    <meta name="description" content="Login to your CarCraft account to manage your cart, orders, and service bookings.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

<!-- TOP NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top site-navbar w-100">
    <div class="container">
        <a class="navbar-brand fw-bold fs-3" href="index.html">
            <i class="bi bi-car-front-fill text-warning"></i>
            Car<span class="text-warning">Craft</span>
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a class="btn btn-outline-light btn-sm px-3" href="index.html">
                <i class="bi bi-house me-1"></i> Home
            </a>
            <a class="btn btn-warning btn-sm px-3" href="register.html">
                Register
            </a>
        </div>
    </div>
</nav>

<!-- CENTERED AUTH FORM -->
<div class="auth-container-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4 d-flex justify-content-center">
                <div class="auth-card shadow-sm">
                    <div class="text-center mb-4">
                        <i class="bi bi-car-front-fill text-warning" style="font-size: 2.4rem;"></i>
                        <h2 class="fw-bold mt-2 mb-1">
                            Car<span class="text-warning">Craft</span>
                        </h2>
                        <p class="text-muted small">Login to access your garage, orders & cart</p>
                    </div>

                    <!-- Error Alert -->
                    <div id="loginError" class="alert alert-danger d-none py-2 small" role="alert"></div>

                    <form id="loginForm" novalidate>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-dark" for="loginEmail">Email, Username, or Phone</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input
                                    type="text"
                                    id="loginEmail"
                                    name="username"
                                    class="form-control"
                                    placeholder="e.g. user@email.com or 9889234561"
                                    autocomplete="username"
                                    required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small text-dark" for="loginPassword">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input
                                    type="password"
                                    id="loginPassword"
                                    name="password"
                                    class="form-control"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3 small">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label text-muted" for="rememberMe">
                                    Remember me
                                </label>
                            </div>
                            <a href="#" class="text-warning text-decoration-none fw-semibold">Forgot Password?</a>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 py-2 fw-bold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Login
                        </button>
                    </form>

                    <hr class="my-3">

                    <p class="text-center small mb-2 text-muted">
                        Don't have an account?
                        <a href="register.html" class="fw-bold text-warning text-decoration-none">Register here</a>
                    </p>

                    <a href="index.html" class="btn btn-outline-dark btn-sm w-100 mt-2">
                        <i class="bi bi-arrow-left me-1"></i> Back to Home
                    </a>

                    <div class="mt-3 p-2 bg-light rounded small text-muted text-center border">
                        <i class="bi bi-shield-check text-success me-1"></i>
                        <strong>Demo Account:</strong> <code>admin@carcraft.com</code> / <code>admin123</code>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-light py-3 mt-auto">
    <div class="container text-center text-secondary small">
        &copy; 2026 CarCraft | Automotive Dealership & Inventory Suite
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>

</body>

</html>
